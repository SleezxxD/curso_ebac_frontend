<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <h1>Formulário</h1>
        <h2>Digite dois números.</h2>
        <form id="numero">
            <input type="number" id="numero-a" required placeholder="Digite o primeiro número" />
            <input type="number" id="numero-b" required placeholder="Digite o segundo número" />
            <p class="error-message">O segundo número precisa ser maior que o primeiro</p>
            <button type="submit" id="btn-envio">Enviar</button>
        </form>
        <p class="success-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
